name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: pnpm install --frozen-lockfile
      - name: Static export for Capacitor
        env:
          PACT_STATIC: "1"
        run: node scripts/static-export.mjs
      - run: pnpm exec cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Pact-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - name: Publish sideload release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Pact-debug.apk
          gh release delete android-debug --yes || true
          gh release create android-debug dist/Pact-debug.apk \
            --title "Pact Android APK" \
            --notes "Sideload this debug APK. Allow Nearby devices, Bluetooth, and Location. Pair a GATT strap (Polar / Garmin HRM / Wahoo), then open Track for live GPS + HR. GitHub Pages is a separate web build at https://ajeenckya5.github.io/pact/" \
            --prerelease
