name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Static export for /pact
        env:
          PACT_STATIC: "1"
          PACT_BASE_PATH: /pact
          NEXT_PUBLIC_PACT_API: https://pact-api.ajeenckya.workers.dev
          NEXT_PUBLIC_PACT_WEB: https://pact-aj.pages.dev
        run: node scripts/static-export.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v4
